name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  python-tests:
    name: Python tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      # The modelling tests use the lightweight numpy/pandas/scikit-learn path;
      # the optional transformer stack is not needed for this CI gate.
      - run: python -m pip install -r requirements.txt numpy==2.2.6 pandas==2.3.2
      - run: python -m unittest discover -s tests -p 'test_*.py'

  terminal-tests:
    name: Terminal tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: terminal
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: terminal/package-lock.json
      - run: npm ci
      - run: npm test -- --run

  terminal-lint:
    name: Terminal lint
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: terminal
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: terminal/package-lock.json
      - run: npm ci
      - run: npm run lint

  production-build:
    name: Production build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: terminal
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: terminal/package-lock.json
      - run: npm ci
      - run: npm run build
