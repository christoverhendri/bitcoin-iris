name: Coinbase hourly API live verification

on:
  push:
    branches:
      - feat/coinbase-hourly-backfill-20261012
    paths:
      - market_data/hourly_prices.py
      - .github/workflows/coinbase-hourly-live.yml
  workflow_dispatch:
    inputs:
      full_backfill:
        description: 'Run the full Coinbase BTC/USD hourly backfill into temporary Actions artifacts'
        required: true
        default: true
        type: boolean

permissions:
  contents: read

jobs:
  public-hourly-probe:
    name: Live Coinbase hourly & historical backfill
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install keyless source and optional Parquet dependencies
        run: python -m pip install -r requirements.txt -r requirements-warehouse.txt
      - name: Verify recent hourly Coinbase response
        run: |
          python -m market_data.hourly_prices probe --start 2026-10-01T00:00:00Z --end 2026-10-02T00:00:00Z --output artifacts/probes/coinbase_recent.json
          python -c "import json; p=json.load(open('artifacts/probes/coinbase_recent.json')); assert p['received_hours']>0, 'No Coinbase hourly candles on recent historical window'"
      - name: Verify early Coinbase BTC/USD historical hourly response
        run: |
          python -m market_data.hourly_prices probe --start 2015-07-21T00:00:00Z --end 2015-07-22T00:00:00Z --output artifacts/probes/coinbase_early.json
          python -c "import json; p=json.load(open('artifacts/probes/coinbase_early.json')); assert p['received_hours']>0, 'No early Coinbase hourly candles in selected probe window'"
      - name: Perform resumable historical BTC/USD hourly backfill
        if: github.event_name == 'push' || inputs.full_backfill == true
        run: |
          CUTOFF="$(date -u +%Y-%m-%dT%H:00:00Z)"
          python -m market_data.hourly_prices backfill --start 2015-07-20T00:00:00Z --end "$CUTOFF" --max-pages 1000 --database artifacts/market/coinbase_hourly.sqlite --output artifacts/probes/coinbase_backfill.json
          python -m market_data.hourly_prices status --database artifacts/market/coinbase_hourly.sqlite > artifacts/probes/coinbase_status.json
          python -m market_data.hourly_prices export --database artifacts/market/coinbase_hourly.sqlite --start 2015-07-20T00:00:00Z --end "$CUTOFF" --output artifacts/warehouse/coinbase_hourly_full
          python -c "import json; from market_data.hourly_prices import verify_hourly; print(json.dumps(verify_hourly('artifacts/warehouse/coinbase_hourly_full'),indent=2))" > artifacts/probes/coinbase_verification.json
      - name: Upload verification evidence and temporary research dataset
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: iris-coinbase-hourly-live
          path: |
            artifacts/probes/
            artifacts/warehouse/coinbase_hourly_full/
            artifacts/market/coinbase_hourly.sqlite
          if-no-files-found: warn
          retention-days: 7
