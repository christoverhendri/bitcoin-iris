name: One-time IRIS obsolete branch cleanup

on:
  push:
    branches:
      - data-pipeline
    paths:
      - .github/workflows/iris-prune-obsolete-branches-once.yml

permissions:
  contents: write

jobs:
  prune:
    if: "github.event.head_commit.message == 'chore: prune 7 audited obsolete branches (one-time)'"
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Verify expected refs, then delete only audited stale branches
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          entries=(
            "feat/coinbase-hourly-backfill-20261012|86e483ccf33d1692e20705f52bc5cb9a2a1d2848"
            "feat/coinbase-minute-activity-20261012|4097ccdee064462f3c0f9651f1ff053906234ad7"
            "feat/free-data-foundation-20261011|f3060c340fc383897f6749228ce54090ee3b356d"
            "feat/m1-trusted-data-gate-20261012|534ed4a4316b0b7c51696b583f74487cbcc5e9ed"
            "feat/warehouse-parquet-duckdb-20261012|24c8aa96c3bfd9ba9b02379a0311762d6ee0326d"
            "system-modelling|149fceb6c2239842589942df71b82e1284282579"
            "terminal-testing|149fceb6c2239842589942df71b82e1284282579"
          )
          echo 'Preflight: checking exact commit hashes of all seven refs'
          for entry in "${entries[@]}"; do
            ref="${entry%%|*}"
            expected_sha="${entry##*|}"
            if [[ "$ref" == "main" || "$ref" == "data-pipeline" ]]; then
              echo "::error::Protected working branch included: $ref"
              exit 1
            fi
            actual_sha="$(gh api "repos/$GH_REPO/git/ref/heads/$ref" --jq '.object.sha')"
            if [[ "$actual_sha" != "$expected_sha" ]]; then
              echo "::error::Branch moved: $ref. Refusing cleanup."
              exit 1
            fi
            echo "Verified $ref @ ${actual_sha:0:12}"
          done
          echo 'Deleting refs only after complete preflight'
          for entry in "${entries[@]}"; do
            ref="${entry%%|*}"
            expected_sha="${entry##*|}"
            actual_sha="$(gh api "repos/$GH_REPO/git/ref/heads/$ref" --jq '.object.sha')"
            if [[ "$actual_sha" != "$expected_sha" ]]; then
              echo "::error::Branch moved just before deletion: $ref"
              exit 1
            fi
            gh api --method DELETE "repos/$GH_REPO/git/refs/heads/$ref"
            echo "Deleted $ref"
          done
          echo 'Cleanup complete: seven audited obsolete branch refs deleted'
